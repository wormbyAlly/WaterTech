<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e6f4f5" />
  <title>Selesai — WaterTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="selesai.css" />
</head>
<body>

  <!-- ============ SPLASH ============ -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash__logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 6C32 6 12 28 12 40a20 20 0 0 0 40 0C52 28 32 6 32 6Z" fill="#7fb8d0"/>
        <path d="M22 40a10 10 0 0 0 10 10" stroke="#ffffff" stroke-width="2.5"
              stroke-linecap="round" fill="none" opacity="0.9"/>
      </svg>
      <span>WaterTech</span>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <main id="app" class="app">

    <section class="card">
      <h1 class="card__title">Selesai!</h1>

      <!-- Checkmark -->
      <div class="success-badge">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="42" fill="#b8e2e0"/>
          <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff"
                  stroke-width="2.5" opacity="0.55"/>
          <path d="M 36 50 L 46 60 L 66 40"
                fill="none" stroke="#ffffff" stroke-width="5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Heading -->
      <h2 class="success-title">Air siap diambil!</h2>
      <p class="success-text">
        Terima kasih telah<br/>
        menggunakan WaterTech.<br/>
        Jangan lupa tutup botolmu!
      </p>

      <!-- Detail transaksi -->
      <div class="detail-box">
        <div class="detail-row">
          <span class="detail-row__label">Volume</span>
          <span class="detail-row__value" id="detailVolume">200ml</span>
        </div>
        <div class="detail-row">
          <span class="detail-row__label">Metode</span>
          <span class="detail-row__value">QRIS</span>
        </div>
      </div>

      <!-- CTA -->
      <button class="btn-primary" id="newTxBtn">Transaksi Baru</button>
    </section>

    <footer class="brand-footer">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
        <path d="M12 3C12 3 5 11 5 15.5A7 7 0 0 0 19 15.5C19 11 12 3 12 3Z"
              stroke="#9bb2c0" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span>WaterTech</span>
    </footer>

  </main>

  <script src="selesai.js"></script>
</body>
</html>
